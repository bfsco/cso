name: Build security permit PDFs

on:
  push:
    paths:
      - '**/*-source.html'
      - '.github/workflows/build-security-permit-pdf.yml'
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render PDFs from source HTML
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          function walk(dir) {
            let out = [];
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ent.name === '.git' || ent.name === 'node_modules') continue;
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) out = out.concat(walk(p));
              else if (ent.isFile() && ent.name.endsWith('-source.html')) out.push(p);
            }
            return out;
          }

          async function waitForImages(page) {
            await page.evaluate(async () => {
              if (document.fonts && document.fonts.ready) await document.fonts.ready;
              const imgs = Array.from(document.images || []);
              await Promise.all(imgs.map(img => {
                if (img.complete) return Promise.resolve();
                return new Promise(resolve => {
                  img.addEventListener('load', resolve, { once: true });
                  img.addEventListener('error', resolve, { once: true });
                });
              }));
            });
          }

          (async () => {
            const files = walk('.');
            if (!files.length) {
              console.log('No *-source.html files found.');
              process.exit(0);
            }

            const browser = await chromium.launch({ headless: true });
            try {
              for (const file of files) {
                const dir = path.dirname(file);
                const base = path.basename(file).replace(/-source\.html$/, '');
                const pdfPath = path.join(dir, base + '.pdf');

                const page = await browser.newPage({
                  viewport: { width: 794, height: 1123 },
                  deviceScaleFactor: 1
                });

                await page.goto('file://' + path.resolve(file), {
                  waitUntil: 'load'
                });
                await waitForImages(page);
                // PDF export only: keep the existing document layout untouched.
                // Do not introduce a second scale or force a different paper size.
                await page.emulateMedia({ media: 'print' });
                await page.addStyleTag({content: `
                  @page { size: A4 portrait; margin: 0; }
                  html, body { margin: 0 !important; padding: 0 !important; }
                  .page { width: 210mm !important; height: 297mm !important; min-height: 297mm !important; max-height: 297mm !important; margin: 0 !important; box-shadow: none !important; }
                  .page + .page { break-before: page !important; page-break-before: always !important; }
                `});
                await page.waitForTimeout(300);

                // Let the source document's own A4 CSS define the geometry.
                // No resizing, zooming, screenshotting, or image conversion.
                await page.pdf({
                  path: pdfPath,
                  format: 'A4',
                  printBackground: true,
                  preferCSSPageSize: true,
                  margin: { top: '0', right: '0', bottom: '0', left: '0' },
                  scale: 1
                });

                await page.close();
                console.log('Created ' + pdfPath);
              }
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Commit generated PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- '*.pdf'
          if git diff --cached --quiet; then
            echo 'No PDF changes to commit.'
          else
            git commit -m 'Build security permit PDFs'
            git push
          fi